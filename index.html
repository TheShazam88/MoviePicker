<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Movie Night</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Movie Night" />
  <meta name="description" content="A quiet, private picker that learns what your household actually likes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #root { min-height: 100%; margin: 0; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) { html, body, #root { background: #0B0B0C; } }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot.gone { display: none; }
    #update-bar { display: none; }
    #update-bar.show {
      display: flex; align-items: center; gap: 12px; justify-content: center;
      position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 60;
      padding: 10px 12px 10px 16px; border-radius: 999px;
      background: #0D0D0D; color: #FFFFFF;
      font: 500 14px/1.2 'Inter', -apple-system, system-ui, sans-serif;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    #update-bar button {
      border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer;
      background: #FFFFFF; color: #0D0D0D; font: 600 14px 'Inter', system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      #update-bar.show { background: #F2F2F3; color: #0B0B0C; }
      #update-bar button { background: #0B0B0C; color: #F2F2F3; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="update-bar">
    <span>A new version is ready.</span>
    <button onclick="location.reload()">Reload</button>
  </div>
  <div id="boot">
    <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="#0D0D0D" />
      <path d="M13 10.9 L21.8 16 L13 21.1 Z" fill="#FFFFFF" />
      <circle cx="11.2" cy="24.6" r="1.7" fill="#1B6B4A" />
      <circle cx="20.8" cy="24.6" r="1.7" fill="#9A2E2E" />
    </svg>
  </div>
  <script>
    // Drop-in replacement for the Claude artifact storage API, backed by this
    // device's localStorage. Everything the app saves - profiles, PINs, ratings,
    // watchlists, watch history, imported titles, settings - stays on the phone.
    // Nothing is uploaded, and app updates never touch it.
    window.storage = {
      async get(key) {
        const v = localStorage.getItem("mnp:" + key);
        if (v === null) throw new Error("key not found: " + key);
        return { key: key, value: v, shared: false };
      },
      async set(key, value) {
        localStorage.setItem("mnp:" + key, value);
        return { key: key, value: value, shared: false };
      },
      async delete(key) {
        localStorage.removeItem("mnp:" + key);
        return { key: key, deleted: true, shared: false };
      },
      async list(prefix) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf("mnp:" + (prefix || "")) === 0) keys.push(k.slice(4));
        }
        return { keys: keys, shared: false };
      }
    };
    // Update handling. The service worker fetches network-first, so a new
    // deploy is picked up on the next launch while online. If a new version
    // installs while the app is open, say so rather than silently swapping.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").then(function (reg) {
          reg.addEventListener("updatefound", function () {
            var sw = reg.installing;
            if (!sw) return;
            sw.addEventListener("statechange", function () {
              if (sw.state === "installed" && navigator.serviceWorker.controller) {
                var bar = document.getElementById("update-bar");
                if (bar) bar.className = "show";
              }
            });
          });
          // Check for a new deploy each time the app is brought to the front.
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) reg.update().catch(function () {});
          });
        }).catch(function () {});
      });
    }
  </script>
  <script src="app.js"></script>
  <script>
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    requestAnimationFrame(function () {
      var b = document.getElementById("boot");
      if (b) b.className = "gone";
    });
  </script>
</body>
</html>
